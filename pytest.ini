[pytest]
testpaths = tests
# No cache folder: inside the container the app user can't write to /app.
# Real-LLM tests only run when asked for: pytest -m real_llm (the last -m wins).
addopts = -p no:cacheprovider -m "not real_llm"
markers =
    real_llm: calls the real Gemini API (needs GEMINI_API_KEY in the environment or .env); skipped otherwise
